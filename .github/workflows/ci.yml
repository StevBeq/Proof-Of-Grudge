name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux native build tools (nasm)
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-near v0.23.0
        env:
          CARGO_NEAR_DISABLE_UPDATE: "1"
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          cargo near --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on moderate/high/critical)
        run: npm audit --audit-level=moderate

      - name: Run all workspace tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build contract WASM and Web UI
        run: npm run build
