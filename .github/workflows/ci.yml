name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-near
        run: cargo install cargo-near --version 0.23.0 --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify RLP golden vectors
        run: npm run vectors:check

      - name: Run contract unit tests
        run: cargo test --manifest-path contract/Cargo.toml

      - name: Run all workspace tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build contract WASM and Web UI
        run: npm run build
